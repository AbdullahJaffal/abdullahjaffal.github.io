<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="windWaterTitle">
    <title id="windWaterTitle">Schematic of the well-based water supply: wells, treatment, storage tank with a tanker fill line, and buried lines below the frost depth</title>

    <defs>
        <marker id="wwArrowAccent" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L12,6 L0,12 Z" fill="#96694e"></path>
        </marker>
        <marker id="wwArrowGray" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L12,6 L0,12 Z" fill="#9ca3af"></path>
        </marker>
        <g id="wwFlake" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round">
            <line x1="0" y1="-6" x2="0" y2="6"></line>
            <line x1="-5.2" y1="-3" x2="5.2" y2="3"></line>
            <line x1="-5.2" y1="3" x2="5.2" y2="-3"></line>
        </g>
    </defs>

    <rect x="0" y="0" width="800" height="450" fill="#ffffff"></rect>

    <!-- Ground surface -->
    <line x1="20" y1="150" x2="780" y2="150" stroke="#6b7280" stroke-width="1.5"></line>

    <!-- Frost line: lines are laid below it -->
    <line x1="20" y1="195" x2="780" y2="195" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 6"></line>
    <use href="#wwFlake" x="210" y="182"></use>
    <use href="#wwFlake" x="510" y="182"></use>
    <use href="#wwFlake" x="740" y="182"></use>

    <!-- Groundwater layer -->
    <path d="M30,315 q10,-6 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" stroke="#c9a688" stroke-width="2" fill="none"></path>
    <path d="M30,330 q10,-6 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" stroke="#c9a688" stroke-width="2" fill="none" opacity="0.6"></path>

    <!-- Two wells: casing down into the groundwater, wellhead with pump above ground -->
    <g stroke="#6b7280" stroke-width="1.5" fill="#ffffff">
        <rect x="63" y="150" width="14" height="185"></rect>
        <rect x="143" y="150" width="14" height="185"></rect>
        <rect x="56" y="122" width="28" height="28" rx="3"></rect>
        <rect x="136" y="122" width="28" height="28" rx="3"></rect>
    </g>
    <g stroke="#96694e" stroke-width="2.5" fill="none">
        <path d="M70,328 L70,150"></path>
        <path d="M150,328 L150,150"></path>
    </g>

    <!-- Supply line from the wells, buried below the frost line, up into treatment -->
    <path d="M70,150 L70,220 L260,220 L260,155" stroke="#96694e" stroke-width="4" fill="none" stroke-linejoin="round" marker-end="url(#wwArrowAccent)"></path>
    <path d="M150,150 L150,220" stroke="#96694e" stroke-width="4" fill="none"></path>

    <!-- Treatment unit (non-potable: irrigation and general use) -->
    <rect x="225" y="95" width="70" height="55" rx="6" fill="#ffffff" stroke="#96694e" stroke-width="2.5"></rect>
    <g stroke="#c9a688" stroke-width="2">
        <line x1="238" y1="140" x2="252" y2="105"></line>
        <line x1="253" y1="140" x2="267" y2="105"></line>
        <line x1="268" y1="140" x2="282" y2="105"></line>
    </g>

    <!-- Treatment to storage tank -->
    <path d="M295,125 L362,125" stroke="#96694e" stroke-width="4" fill="none" marker-end="url(#wwArrowAccent)"></path>

    <!-- Storage tank -->
    <g fill="#ffffff" stroke="#96694e" stroke-width="2.5">
        <path d="M370,78 L370,150 L460,150 L460,78"></path>
        <ellipse cx="415" cy="78" rx="45" ry="10"></ellipse>
    </g>
    <path d="M380,112 q9,-6 18,0 t18,0 t18,0 t18,0" stroke="#c9a688" stroke-width="2" fill="none" stroke-linecap="round"></path>

    <!-- Tanker truck: backup fill line into the tank -->
    <g stroke="#6b7280" stroke-width="1.5" fill="#ffffff">
        <rect x="500" y="108" width="80" height="30" rx="12"></rect>
        <path d="M580,138 L580,114 L600,114 L612,126 L612,138 Z"></path>
        <line x1="495" y1="138" x2="615" y2="138"></line>
    </g>
    <g fill="#ffffff" stroke="#6b7280" stroke-width="1.5">
        <circle cx="520" cy="142" r="8"></circle>
        <circle cx="595" cy="142" r="8"></circle>
    </g>
    <path d="M500,118 C 485,100 478,92 468,92" stroke="#9ca3af" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#wwArrowGray)"></path>

    <!-- Tank to the building, buried below the frost line -->
    <path d="M440,150 L440,230 L700,230 L700,158" stroke="#96694e" stroke-width="4" fill="none" stroke-linejoin="round" marker-end="url(#wwArrowAccent)"></path>

    <!-- Administrative / control building -->
    <rect x="650" y="85" width="110" height="65" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"></rect>
    <rect x="650" y="78" width="110" height="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"></rect>
    <rect x="725" y="115" width="18" height="35" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"></rect>
    <rect x="665" y="100" width="22" height="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"></rect>

    <!-- Baseline -->
    <line x1="20" y1="360" x2="780" y2="360" stroke="#e5e7eb" stroke-width="1"></line>
</svg>
