<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="khWasteTitle">
    <title id="khWasteTitle">Schematic of wastewater flowing by gravity from the two-villa buildings to a packaged treatment plant, treated water pumped to irrigation, and a backup line to a pump pit and an underground seepage pit</title>

    <defs>
        <marker id="kxArrowAccent" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L12,6 L0,12 Z" fill="#96694e"></path>
        </marker>
        <marker id="kxArrowGray" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L12,6 L0,12 Z" fill="#9ca3af"></path>
        </marker>
        <g id="kxVilla" stroke="#6b7280" stroke-width="1.5" fill="#ffffff">
            <path d="M0,30 L45,6 L90,30 Z"></path>
            <rect x="5" y="30" width="80" height="40"></rect>
            <line x1="45" y1="30" x2="45" y2="70"></line>
            <rect x="15" y="40" width="14" height="12" fill="#f3f4f6"></rect>
            <rect x="61" y="40" width="14" height="12" fill="#f3f4f6"></rect>
        </g>
    </defs>

    <rect x="0" y="0" width="800" height="450" fill="#ffffff"></rect>

    <!-- Sloping ground -->
    <path d="M20,110 L780,175" stroke="#6b7280" stroke-width="1.5" fill="none"></path>

    <!-- Two-villa buildings -->
    <use href="#kxVilla" x="55" y="46"></use>
    <use href="#kxVilla" x="185" y="57"></use>

    <!-- House connections and the gravity sewer with manholes -->
    <g stroke="#9ca3af" stroke-width="2" fill="none">
        <path d="M100,116 L100,168"></path>
        <path d="M230,127 L230,183"></path>
    </g>
    <path d="M100,175 L436,217" stroke="#96694e" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#kxArrowAccent)"></path>
    <g fill="#ffffff" stroke="#96694e" stroke-width="2.5">
        <circle cx="100" cy="175" r="7"></circle>
        <circle cx="230" cy="191" r="7"></circle>
        <circle cx="350" cy="206" r="7"></circle>
    </g>

    <!-- Packaged treatment plant with rotating discs -->
    <rect x="440" y="188" width="120" height="72" rx="8" fill="#ffffff" stroke="#96694e" stroke-width="2.5"></rect>
    <line x1="455" y1="222" x2="545" y2="222" stroke="#6b7280" stroke-width="2"></line>
    <g fill="none" stroke="#96694e" stroke-width="2">
        <ellipse cx="470" cy="222" rx="6" ry="24"></ellipse>
        <ellipse cx="490" cy="222" rx="6" ry="24"></ellipse>
        <ellipse cx="510" cy="222" rx="6" ry="24"></ellipse>
        <ellipse cx="530" cy="222" rx="6" ry="24"></ellipse>
    </g>
    <path d="M448,232 q6,-5 12,0 t12,0 t12,0 t12,0 t12,0 t12,0 t12,0 t12,0 t12,0" stroke="#c9a688" stroke-width="2" fill="none" stroke-linecap="round"></path>

    <!-- Treated water tank -->
    <path d="M560,225 L586,225" stroke="#96694e" stroke-width="3.5" fill="none" marker-end="url(#kxArrowAccent)"></path>
    <rect x="590" y="195" width="70" height="65" rx="6" fill="#ffffff" stroke="#96694e" stroke-width="2.5"></rect>
    <path d="M598,228 q6,-5 12,0 t12,0 t12,0 t12,0 t12,0" stroke="#c9a688" stroke-width="2" fill="none" stroke-linecap="round"></path>

    <!-- Pump and forced line up to irrigation -->
    <path d="M660,215 L676,215" stroke="#96694e" stroke-width="3" fill="none"></path>
    <circle cx="685" cy="215" r="9" fill="#ffffff" stroke="#96694e" stroke-width="2.5"></circle>
    <path d="M681,210 L690,215 L681,220 Z" fill="#96694e"></path>
    <path d="M694,215 L720,215 L720,150" stroke="#96694e" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#kxArrowAccent)"></path>
    <circle cx="720" cy="140" r="5" fill="#96694e"></circle>
    <g stroke="#c9a688" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M700,132 q20,-22 40,0"></path>
        <path d="M690,138 q30,-34 60,0"></path>
    </g>
    <g stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" fill="none">
        <path d="M676,158 l4,-10 l4,10 M748,164 l4,-10 l4,10"></path>
    </g>

    <!-- Backup only: pump pit and underground seepage pit -->
    <path d="M520,260 L520,312 L586,312" stroke="#9ca3af" stroke-width="2.5" fill="none" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#kxArrowGray)"></path>
    <rect x="590" y="288" width="50" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"></rect>
    <circle cx="615" cy="322" r="7" fill="#ffffff" stroke="#9ca3af" stroke-width="2"></circle>
    <path d="M640,312 L686,312" stroke="#9ca3af" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#kxArrowGray)"></path>
    <rect x="690" y="280" width="70" height="70" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"></rect>
    <g fill="#c9a688" opacity="0.8">
        <circle cx="697" cy="290" r="3.5"></circle><circle cx="697" cy="304" r="3.5"></circle><circle cx="697" cy="318" r="3.5"></circle><circle cx="697" cy="332" r="3.5"></circle>
        <circle cx="753" cy="290" r="3.5"></circle><circle cx="753" cy="304" r="3.5"></circle><circle cx="753" cy="318" r="3.5"></circle><circle cx="753" cy="332" r="3.5"></circle>
        <circle cx="708" cy="343" r="3.5"></circle><circle cx="722" cy="343" r="3.5"></circle><circle cx="736" cy="343" r="3.5"></circle><circle cx="750" cy="343" r="3.5"></circle>
    </g>
    <g stroke="#9ca3af" stroke-width="1.5" fill="none">
        <path d="M765,315 L782,315" marker-end="url(#kxArrowGray)"></path>
        <path d="M725,355 L725,372" marker-end="url(#kxArrowGray)"></path>
    </g>

    <!-- Baseline -->
    <line x1="20" y1="385" x2="780" y2="385" stroke="#e5e7eb" stroke-width="1"></line>
</svg>
